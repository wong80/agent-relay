# Local-cluster credentials only.  For a shared cluster, create this Secret out
# of band (kubectl create secret / a secrets manager) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-db
  namespace: agent-relay
  labels:
    app.kubernetes.io/part-of: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: agent_relay
  # The relay reaches PostgreSQL through the `postgres` Service's DNS name.
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/agent_relay
